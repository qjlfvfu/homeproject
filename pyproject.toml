[project]
name = "pythonproject"
version = "0.1.0"
description = ""
authors = [
    { name = "Nik", email = "sir.nikolai00@mail.ru" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.32.4,<3.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "pandas (>=2.3.2,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "retry (>=0.9.2,<0.10.0)"
]

[tool.pytest.ini_options]
pythonpath = "."

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^1.17.1"
black = "^25.1.0"
isort = "^6.0.1"


[tool.poetry.group.dev.dependencies]
pytest-cov = "^6.2.1"

[tool.isort]
line_length = 119

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "src.*"
module_explicit_any = true

[tool.black]
line-length = 119
exclude = '''
(
    /(
        \.eggs # Исключить несколько общих каталогов
        | \.git # в корне проекта
        | \.mypy_cache
        | \.venv
     )/
    | foo.py # Также отдельно исключить файл с именем foo.py
)           # в корне проекта
'''